# SécuriSite — production (serveur dédié), architecture PostgreSQL.
#
# Remplace l'ancien docker-compose.prod.yml (modèle SQLite, obsolète depuis
# la migration PostgreSQL PG-6→PG-30 — voir docs/production-readiness-plan.md
# §1). Aucune valeur secrète réelle dans ce fichier : tout vient de
# variables d'environnement, à fournir via un fichier `.env` local
# (jamais committé — voir .env.production.example) ou le gestionnaire de
# secrets de la plateforme. `docker compose` charge automatiquement un
# fichier `.env` situé à côté de ce fichier.
#
# PostgreSQL n'est JAMAIS exposé à l'hôte : seul le réseau `internal`
# (interne à ce compose) y accède. `app` n'est pas non plus publié
# publiquement par défaut ici — un reverse proxy déjà en place sur ce
# serveur (Nginx/Caddy/Traefik/Coolify) doit l'atteindre soit via un port
# lié à 127.0.0.1 (proxy sur l'hôte), soit via un réseau Docker partagé
# (proxy conteneurisé) — voir docs/production-reverse-proxy.md, aucun des
# deux n'est choisi arbitrairement ici.
#
# Séquence de démarrage : db (healthy) -> migrate (MIGRATOR, une fois,
# succès obligatoire) -> app (APP uniquement). Les rôles PostgreSQL
# (OWNER/MIGRATOR/APP) ne sont PAS créés par ce compose : provisioning
# initial séparé, une fois, voir scripts/provision-production-db.sh —
# jamais automatique à chaque `docker compose up` (nécessiterait d'exposer
# en permanence des identifiants superutilisateur à un conteneur qui
# démarre systématiquement).
#
# Commandes (à exécuter UNIQUEMENT sur le serveur cible, jamais depuis ce
# poste de développement) :
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d db
#   # (une fois) : ./scripts/provision-production-db.sh
#   docker compose -f docker-compose.prod.yml up migrate
#   docker compose -f docker-compose.prod.yml up -d app

x-app-image: &app-image
  image: securisite-app:${IMAGE_TAG:-latest}

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Superutilisateur du cluster (image officielle) — utilisé UNIQUEMENT
      # par scripts/provision-production-db.sh pour créer les rôles
      # OWNER/MIGRATOR/APP et la base ; jamais par l'application au
      # runtime (voir service `app` : rôle APP exclusivement).
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD requis}
      # Pas de POSTGRES_DB ici : la base `securisite` doit être créée avec
      # OWNER=securisite_owner (jamais le superutilisateur par défaut) —
      # scripts/provision-production-db.sh s'en charge dans le bon ordre
      # (piège rencontré et documenté en staging : créer la base sans le
      # bon OWNER fait échouer les GRANT du rôle MIGRATOR ensuite).
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - securisite_pgdata:/var/lib/postgresql/data
    networks:
      - internal
    # PAS de `ports:` ici : PostgreSQL n'est joignable que depuis le
    # réseau Docker interne `internal`, jamais depuis l'hôte ni Internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Une exécution, avant tout démarrage de `app` (`depends_on` +
  # service_completed_successfully) : applique les migrations 001->010
  # avec le rôle MIGRATOR — jamais avec APP (qui n'a aucun droit DDL) ni
  # OWNER (NOLOGIN, ne se connecte jamais). Échec ici = `app` ne démarre
  # jamais (fail-closed, cohérent avec server.js#start() qui refuse déjà
  # d'écouter sans base saine).
  migrate:
    <<: *app-image
    build: .
    restart: "no"
    command: ["node", "backend/db/postgresql/migrate-cli.js"]
    environment:
      DATABASE_URL: postgres://${SECURISITE_MIGRATOR_ROLE:-securisite_migrator}:${SECURISITE_MIGRATOR_PASSWORD:?SECURISITE_MIGRATOR_PASSWORD requis}@db:5432/${SECURISITE_DB_NAME:-securisite}
      # `disable` par défaut : lien interne au réseau Docker de ce compose,
      # jamais exposé. Passer à verify-full (+ PGSSLROOTCERT) si
      # PostgreSQL n'est PAS colocalisé dans ce même compose (base managée
      # externe) — voir docs/postgresql-deployment.md §3.
      PGSSL: ${PGSSL:-disable}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app-image
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis (>=32 caractères aléatoires)}
      DATABASE_URL: postgres://${SECURISITE_APP_ROLE:-securisite_app}:${SECURISITE_APP_PASSWORD:?SECURISITE_APP_PASSWORD requis}@db:5432/${SECURISITE_DB_NAME:-securisite}
      PGSSL: ${PGSSL:-disable}
      # Frontend et API servis par ce même conteneur (express.static) sur
      # le même domaine : laisser vide sauf si un domaine séparé consomme
      # l'API (docs/production-readiness-plan.md §4).
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      # Optionnel : voir le montage commenté ci-dessous. Absent = aucune
      # caméra, fail-closed (jamais "ouvert par défaut").
      # SECURISITE_CAMERAS_CONFIG_FILE: /run/secrets/cameras.json
    # volumes:
    #   # Config caméra : fichier local sur LE SERVEUR (jamais dans Git,
    #   # jamais construit dans l'image) — voir docs/camera-proxy.md.
    #   - ${SECURISITE_CAMERAS_CONFIG_FILE_HOST:-./cameras.json}:/run/secrets/cameras.json:ro
    networks:
      - internal
    # PAS de `ports:` publié par défaut : un reverse proxy déjà présent
    # sur ce serveur doit l'atteindre. Décommenter LA SEULE ligne qui
    # correspond à la topologie réelle (voir docs/production-reverse-proxy.md) :
    #   - un proxy qui tourne DIRECTEMENT SUR L'HÔTE (Nginx/Caddy installés
    #     hors Docker) : lier au loopback uniquement, jamais 0.0.0.0 :
    #       ports: ["127.0.0.1:3000:3000"]
    #   - un proxy CONTENEURISÉ (Traefik/Coolify, ou Nginx/Caddy en
    #     conteneur) : ne pas publier de port ici, rejoindre à la place le
    #     réseau Docker partagé du proxy (nom exact à vérifier sur le
    #     serveur) :
    #       networks: [internal, <réseau-partagé-du-proxy>]
    #     et ajouter les labels du proxy concerné (exemples Traefik dans
    #     docs/production-reverse-proxy.md).
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  internal:
    driver: bridge
    internal: false # false = les conteneurs peuvent sortir vers Internet (IA/push futurs) ; PostgreSQL reste protégé par l'absence de `ports:`, pas par l'isolation réseau seule

volumes:
  securisite_pgdata:
